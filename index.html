<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiona Alston — Left-footed forward, Class of 2028</title>
<meta name="description" content="Fiona Alston is a left-footed forward for De Anza Force 10G ECNL, class of 2028. Highlight film, soccer history, academics, showcase schedule and coaching references.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@1,300;1,400&family=Saira+Condensed:wght@600;700;800&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --pitch:   #073B5C;
    --pitch-2: #0F4F78;
    --pitch-3: #052A42;
    --sky:     #7DC8EC;
    --sky-dim: #4E9EC4;
    --bone:    #FBFCFB;
    --stone:   #EDF1EE;
    --ink:     #0F1A15;
    --muted:   #5E7268;
    --muted-d: #9FB8AC;
    --rule:    #D6E0DA;
    --rule-d:  rgba(125,200,236,.22);

    --disp:  'Saira Condensed', 'Arial Narrow', sans-serif;
    --body:  'Saira', system-ui, sans-serif;
    --serif: 'Newsreader', Georgia, serif;

    --gut: clamp(18px, 4.5vw, 60px);
    --max: 1200px;
    --bar: 5px;              /* the left axis */
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bone); color:var(--ink);
    font-family:var(--body); font-size:16.5px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{ max-width:100%; display:block; }
  .wrap{ max-width:var(--max); margin:0 auto; padding-inline:var(--gut); }

  /* ---------- the left axis: signature device ---------- */
  .axis{
    position:relative;
    padding-left:22px;
    margin:0 0 26px;
    font-family:var(--disp);
    font-size:clamp(26px, 4.4vw, 44px);
    font-weight:800;
    letter-spacing:.03em;
    text-transform:uppercase;
    line-height:1;
  }
  .axis::before{
    content:""; position:absolute; left:0; top:.06em; bottom:.06em;
    width:var(--bar); background:var(--sky);
  }
  .on-dark .axis{ color:var(--bone); }

  /* ---------- hero ---------- */
  .hero{
    position:relative; background:var(--pitch); color:var(--bone);
    overflow:hidden; display:flex; align-items:flex-end;
    min-height:clamp(430px, 74vh, 660px);
  }
  /* Cut-out portrait: stands on the hero baseline, right-aligned to the
     content column. Never cropped — background-size:contain. */
  .hero__photo{
    position:absolute; z-index:2; top:0; bottom:0; left:auto;
    right:max(0px, calc((100% - var(--max)) / 2));
    width:min(46%, 520px);
    background-size:contain;
    background-position:right bottom;
    background-repeat:no-repeat;
    /* The source ends at her hip, so the hero's bottom edge would slice
       her torso. Dissolve into the green instead of chopping. */
    -webkit-mask-image:linear-gradient(to bottom,
      #000 72%, rgba(0,0,0,.35) 90%, transparent 100%);
    mask-image:linear-gradient(to bottom,
      #000 72%, rgba(0,0,0,.35) 90%, transparent 100%);
  }
  .hero::after{
    content:""; position:absolute; inset:0; z-index:1;
    background:
      linear-gradient(to top, var(--pitch) 4%, rgba(7,59,92,.82) 42%, rgba(7,59,92,.30) 82%),
      linear-gradient(to right, rgba(7,59,92,.88), rgba(7,59,92,.10) 62%);
  }
  /* Keep the headline clear of the figure once they sit side by side.
     The name is sized off the viewport, so ease it down too — otherwise
     it runs under her at mid widths. */
  @media (min-width:900px){
    .hero__in{ padding-right:calc(var(--gut) + min(44%, 470px)); }
  }
  /* Too narrow to stand beside the type — drop her behind it and even out
     the scrim, which is weak up top where her face now lands. */
  @media (max-width:899px){
    .hero__photo{ z-index:1; right:0; width:min(105%, 470px); opacity:.8; }
    .hero::after{
      z-index:2;
      background:linear-gradient(to top,
        var(--pitch) 5%, rgba(7,59,92,.88) 48%, rgba(7,59,92,.74) 100%);
    }
  }
  .hero__in{ position:relative; z-index:3; width:100%; padding-block:0 clamp(30px,5vw,52px); }

  /* vertical eyebrow up the left edge */
  .hero__vert{
    position:absolute; left:calc(var(--gut) - 34px); bottom:clamp(30px,5vw,52px);
    transform:rotate(180deg); writing-mode:vertical-rl;
    font-family:var(--disp); font-size:13px; font-weight:700;
    letter-spacing:.42em; text-transform:uppercase; color:var(--sky);
    z-index:3;
  }
  @media (max-width:820px){ .hero__vert{ display:none; } }

  .topbar{
    position:relative; z-index:4;
    display:flex; justify-content:flex-end; gap:12px;
    padding-block:20px;
  }
  .icon{
    width:40px; height:40px; display:grid; place-items:center;
    border:1.5px solid rgba(251,252,251,.42); color:var(--bone);
    text-decoration:none; transition:background .18s, color .18s, border-color .18s;
  }
  .icon:hover{ background:var(--sky); border-color:var(--sky); color:var(--pitch); }
  .icon svg{ width:19px; height:19px; fill:currentColor; }

  .hero__num{
    font-family:var(--disp); font-weight:800;
    font-size:clamp(15px,2vw,19px); letter-spacing:.26em;
    color:var(--sky); margin:0 0 10px; text-transform:uppercase;
  }
  .hero__name{
    font-family:var(--disp); font-weight:800;
    font-size:clamp(60px, 15vw, 178px); line-height:.82;
    letter-spacing:.005em; text-transform:uppercase; margin:0;
  }
  .hero__name span{ display:block; }
  .hero__name span:last-child{ color:var(--sky); }
  /* Sized off the viewport, so ease it down where the figure sits
     beside it — otherwise the name runs under her at mid widths. */
  @media (min-width:900px){
    .hero__name{ font-size:clamp(60px, 12.5vw, 178px); }
  }
  .hero__pos{
    font-family:var(--serif); font-style:italic; font-weight:300;
    font-size:clamp(16px,2.3vw,22px); line-height:1.45;
    color:rgba(251,252,251,.9); max-width:46ch; margin:22px 0 0;
  }
  .hero__meta{
    display:flex; gap:10px 22px; flex-wrap:wrap; margin:22px 0 0;
    font-family:var(--disp); font-weight:700; font-size:clamp(14px,1.9vw,18px);
    letter-spacing:.15em; text-transform:uppercase;
  }
  .hero__meta span{ position:relative; padding-left:15px; }
  .hero__meta span::before{
    content:""; position:absolute; left:0; top:.42em; width:6px; height:6px; background:var(--sky);
  }
  .commit{ color:var(--sky); }
  .hero__cta{ display:flex; gap:11px; flex-wrap:wrap; margin-top:26px; }
  .badges{ display:flex; gap:32px; align-items:center; flex-wrap:wrap; margin-top:26px; }
  .badge{
    font-family:var(--disp); font-weight:700; font-size:12.5px;
    letter-spacing:.2em; text-transform:uppercase;
    border:1.5px solid rgba(251,252,251,.34); padding:7px 13px;
    color:rgba(251,252,251,.85);
  }
  .badge img{ height:100px; width:auto; }
  .badge--img{ border:0; padding:0; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:9px;
    font-family:var(--disp); font-size:15px; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; text-decoration:none;
    padding:12px 24px; border:2px solid var(--sky);
    background:var(--sky); color:var(--pitch);
    transition:background .18s, color .18s;
  }
  .btn:hover{ background:transparent; color:var(--sky); }
  .btn--out{ background:transparent; color:var(--bone); border-color:rgba(251,252,251,.5); }
  .btn--out:hover{ background:var(--bone); color:var(--pitch); border-color:var(--bone); }
  .btn--dark{ background:var(--pitch); color:var(--bone); border-color:var(--pitch); }
  .btn--dark:hover{ background:transparent; color:var(--pitch); }

  /* ---------- fact band ---------- */
  .facts{ background:var(--pitch-3); color:var(--bone); }
  .facts__g{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); }
  .fact{ padding:17px 24px 19px 24px; border-right:1px solid var(--rule-d); }
  .fact:first-child{ padding-left:0; }
  .fact:last-child{ border-right:0; padding-right:0; transform:translateX(-50%); }
  .fact:nth-last-child(2){ border-right:0; }
  .fact b{
    display:block; font-family:var(--disp); font-size:12.5px; font-weight:700;
    letter-spacing:.2em; text-transform:uppercase; color:var(--sky); margin-bottom:2px;
  }
  .fact i{ font-style:normal; font-size:16.5px; font-weight:600; }

  /* ---------- sections ---------- */
  .sec{ padding-block:clamp(46px,7vw,86px); }
  .sec--dark{ background:var(--pitch); color:var(--bone); }
  .sec--stone{ background:var(--stone); }

  /* ---------- highlights ---------- */
  .frame{
    position:relative; aspect-ratio:16/9; width:100%;
    background:var(--pitch-3); border:1px solid var(--rule); margin-bottom:14px;
  }
  .frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .frame--empty{ display:grid; place-items:center; color:var(--muted-d); text-align:center; padding:24px; }
  .vgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:clamp(18px,3vw,34px); }
  .vcap{ font-family:var(--disp); font-weight:700; font-size:17px; letter-spacing:.06em; text-transform:uppercase; margin:0; }
  .vsub{ color:var(--muted); font-size:15px; margin:2px 0 0; }
  .vcard a{ color:inherit; text-decoration:none; }
  .vcard a:hover .vcap{ color:var(--sky-dim); }

  /* ---------- layout ---------- */
  .cols2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:clamp(28px,4.5vw,64px); align-items:start; }
  .cols3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:clamp(28px,4vw,52px); align-items:start; }

  /* ---------- year list (Audrey-style entries) ---------- */
  .grp + .grp{ margin-top:30px; }
  .grp__h{
    font-family:var(--disp); font-weight:700; font-size:22px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--sky-dim);
    margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--rule);
  }
  .on-dark .grp__h{ color:var(--sky); border-bottom-color:var(--rule-d); }
  .ylist{ list-style:none; margin:0; padding:0; }
  .ylist li{ padding:7px 0; }
  .ylist b{ font-weight:700; color:var(--ink); }
  .on-dark .ylist b{ color:var(--sky); }
  .ylist a{ color:inherit; text-decoration:none; border-bottom:1px solid var(--sky-dim); }
  .ylist a:hover{ background:rgba(125,200,236,.18); }

  /* ---------- rows ---------- */
  .rows{ list-style:none; margin:0; padding:0; }
  .row{ display:grid; grid-template-columns:1fr auto; gap:3px 22px; align-items:baseline;
        padding:13px 0; border-bottom:1px solid var(--rule); }
  .on-dark .row{ border-bottom-color:var(--rule-d); }
  .row__m{ font-size:17px; font-weight:600; line-height:1.35; }
  .row__m .soft{ font-weight:400; color:var(--muted); }
  .on-dark .row__m .soft{ color:var(--muted-d); }
  .row__d{ font-family:var(--disp); font-weight:700; font-size:14.5px; letter-spacing:.1em;
           text-transform:uppercase; color:var(--sky-dim); white-space:nowrap; }
  .on-dark .row__d{ color:var(--sky); }
  .row--sched{ grid-template-columns:132px 1fr; }
  .row--national .row__m{ color:var(--sky-dim); }
  .row__t{ display:block; font-family:var(--body); font-weight:400; font-size:12.5px;
           letter-spacing:normal; text-transform:none; color:var(--muted); margin-top:2px; }
  .on-dark .row__t{ color:var(--muted-d); }
  .empty{ color:var(--muted); font-style:italic; padding:13px 0; border-bottom:1px solid var(--rule); margin:0; }
  .on-dark .empty{ color:var(--muted-d); border-bottom-color:var(--rule-d); }
  .subh{ font-family:var(--disp); font-weight:700; font-size:14px; letter-spacing:.2em;
         text-transform:uppercase; color:var(--muted); margin:0 0 4px; }
  .on-dark .subh{ color:var(--muted-d); }
  .subh ~ .subh{ margin-top:26px; }

  /* ---------- personal card ---------- */
  .pcard{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); background:var(--bone);
          border:1px solid var(--rule); }
  .pcard__img{ min-height:250px; background-size:cover; background-position:center; background-color:var(--pitch-2); }
  .pcard__b{ padding:clamp(20px,3vw,32px); }
  .dl{ margin:0; }
  .dl div{ padding:8px 0; border-bottom:1px solid var(--rule); }
  .dl div:last-child{ border-bottom:0; }
  .dl dt{ font-family:var(--disp); font-weight:700; font-size:13px; letter-spacing:.16em;
          text-transform:uppercase; color:var(--muted); }
  .dl dd{ margin:1px 0 0; font-weight:600; }
  .dl dd a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--sky-dim); word-break:break-word; }
  .dl dd a:hover{ background:rgba(125,200,236,.2); }

  /* ---------- coaches ---------- */
  .coaches{ display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:1px; background:var(--rule-d); }
  .coach{ background:var(--pitch); padding:15px 17px 17px; }
  .coach b{ display:block; font-family:var(--disp); font-weight:700; font-size:12.5px;
            letter-spacing:.18em; text-transform:uppercase; color:var(--sky); margin-bottom:2px; }
  .coach strong{ display:block; font-size:17px; margin-bottom:6px; }
  .coach a{ display:block; font-size:15px; color:rgba(251,252,251,.82); text-decoration:none; word-break:break-word; }
  .coach a:hover{ color:var(--sky); }

  /* ---------- footer ---------- */
  .foot{ background:var(--pitch-3); color:var(--muted-d); }
  .foot__in{ display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-block:24px;
             font-family:var(--disp); font-size:14px; letter-spacing:.16em; text-transform:uppercase; }

  /* ---------- a11y ---------- */
  a:focus-visible,.btn:focus-visible,.icon:focus-visible{ outline:3px solid var(--sky); outline-offset:3px; }
  .skip{ position:absolute; left:-9999px; background:var(--sky); color:var(--pitch);
         padding:12px 20px; font-family:var(--disp); z-index:30; }
  .skip:focus{ left:12px; top:12px; }
  @media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } }
  @media (max-width:560px){
    .fact{ border-right:0; border-bottom:1px solid var(--rule-d); padding-left:0; padding-right:0; }
    .fact:last-child{ border-bottom:0; }
  }
</style>
</head>

<body>
<a class="skip" href="#highlights">Skip to highlight film</a>

<header class="hero">
  <div class="hero__photo" id="heroPhoto" aria-hidden="true"></div>
  <div class="hero__vert" id="vert" aria-hidden="true"></div>
  <div class="wrap hero__in">
    <nav class="topbar" id="topbar" aria-label="Social and contact"></nav>
    <p class="hero__num" id="hnum"></p>
    <h1 class="hero__name" id="hname"></h1>
    <p class="hero__pos" id="hpos"></p>
    <div class="hero__meta" id="hmeta"></div>
    <div class="hero__cta">
      <a class="btn" href="#highlights">Watch highlights</a>
      <a class="btn" href="#contact">Contact</a>
    </div>
    <div class="badges" id="badges"></div>
  </div>
</header>

<div class="facts"><div class="wrap"><div class="facts__g" id="facts"></div></div></div>

<section class="sec wrap" id="highlights">
  <h2 class="axis">Highlights</h2>
  <div id="hl"></div>
</section>

<section class="sec sec--stone">
  <div class="wrap">
    <h2 class="axis">Personal info</h2>
    <div class="pcard">
      <div class="pcard__img" id="pimg" aria-hidden="true"></div>
      <div class="pcard__b"><dl class="dl" id="personal"></dl></div>
    </div>
  </div>
</section>

<section class="sec sec--dark on-dark">
  <div class="wrap">
    <div class="cols2">
      <div>
        <h2 class="axis">Soccer</h2>
        <div id="soccer"></div>
      </div>
      <div>
        <h2 class="axis" style="visibility:hidden" aria-hidden="true">Previous events</h2>
        <div id="events"></div>
      </div>
    </div>
  </div>
</section>

<section class="sec wrap" id="upcoming">
  <h2 class="axis">2026-27 game &amp; showcase schedule</h2>
  <div id="upcomingEvents"></div>
</section>

<section class="sec wrap">
  <div class="cols3">
    <div>
      <h2 class="axis">Academics</h2>
      <div id="academics"></div>
    </div>
    <div>
      <h2 class="axis">Articles</h2>
      <ul class="rows" id="articles"></ul>
    </div>
    <div>
      <h2 class="axis">Clubs &amp; volunteering</h2>
      <ul class="ylist" id="clubs"></ul>
    </div>
  </div>
</section>

<section class="sec sec--dark on-dark" id="contact">
  <div class="wrap">
    <div class="cols2">
      <div>
        <h2 class="axis">Contact</h2>
        <dl class="dl" id="contactList" style="--rule:rgba(125,200,236,.22)"></dl>
      </div>
      <div>
        <h2 class="axis">Coaching references</h2>
        <div class="coaches" id="coaches"></div>
      </div>
    </div>
  </div>
</section>

<footer class="foot"><div class="wrap foot__in">
  <span id="fname"></span><span id="fupd"></span>
</div></footer>

<script src="profile.js"></script>
<script>
(function(){
  const P = (typeof PROFILE !== 'undefined') ? PROFILE : null; if(!P) return;
  const $ = i => document.getElementById(i);
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const full = P.firstName + ' ' + P.lastName;
  const tel = p => 'tel:' + String(p).replace(/[^\d+]/g,'');

  const IC = {
    ig:'<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.05 1.8.25 2.2.42.6.22 1 .48 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c0 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2 0-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2-.1-1.3-.1-1.7-.1-4.9s0-3.6.1-4.9c0-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 3.2a6.6 6.6 0 100 13.2 6.6 6.6 0 000-13.2zm0 10.9a4.3 4.3 0 110-8.6 4.3 4.3 0 010 8.6zm6.9-11.1a1.55 1.55 0 11-3.1 0 1.55 1.55 0 013.1 0z"/></svg>',
    yt:'<svg viewBox="0 0 24 24"><path d="M23 7.5s-.2-1.6-.9-2.3c-.9-.9-1.8-.9-2.3-1C17 4 12 4 12 4s-5 0-7.8.2c-.4.1-1.4.1-2.3 1-.7.7-.9 2.3-.9 2.3S.8 9.4.8 11.3v1.4c0 1.9.2 3.8.2 3.8s.2 1.6.9 2.3c.9.9 2 .9 2.5 1 1.8.2 7.6.2 7.6.2s5 0 7.8-.2c.5-.1 1.4-.1 2.3-1 .7-.7.9-2.3.9-2.3s.2-1.9.2-3.8v-1.4c0-1.9-.2-3.8-.2-3.8zM9.8 15.2V8.9l6.4 3.2-6.4 3.1z"/></svg>',
    mail:'<svg viewBox="0 0 24 24"><path d="M2 5h20v14H2V5zm10 7.2L3.8 6.6h16.4L12 12.2zM4 8.3v8.7h16V8.3l-8 5.5-8-5.5z"/></svg>'
  };

  /* hero */
  if(P.heroPhoto) $('heroPhoto').style.backgroundImage='url("'+P.heroPhoto+'")';
  $('vert').textContent = P.eyebrow || '';
  $('hnum').textContent = [P.eyebrow, P.number ? '#'+P.number : ''].filter(Boolean).join('  \u2022  ');
  $('hname').innerHTML = '<span>'+esc(P.firstName)+'</span><span>'+esc(P.lastName)+'</span>';
  $('hpos').textContent = P.positioning || '';
  $('hmeta').innerHTML = [P.club, P.role, P.classYear,
      P.commitment ? '<span class="commit">Committed: '+esc(P.commitment)+'</span>' : '']
    .filter(Boolean).map(x => x.indexOf('<span')===0 ? x : '<span>'+esc(x)+'</span>').join('');

  const s = P.social||{}, c = P.contact||{};
  $('topbar').innerHTML =
    (s.instagram?'<a class="icon" href="'+esc(s.instagram)+'" target="_blank" rel="noopener" aria-label="Instagram">'+IC.ig+'</a>':'')+
    (s.youtube  ?'<a class="icon" href="'+esc(s.youtube)+'" target="_blank" rel="noopener" aria-label="YouTube">'+IC.yt+'</a>':'')+
    (c.email    ?'<a class="icon" href="mailto:'+esc(c.email)+'" aria-label="Email">'+IC.mail+'</a>':'');

  $('badges').innerHTML = (P.badges||[]).map(b => b.image
    ? '<span class="badge badge--img"><img src="'+esc(b.image)+'" alt="'+esc(b.label)+'"></span>'
    : '<span class="badge">'+esc(b.label)+'</span>').join('');

  $('facts').innerHTML = (P.keyFacts||[]).map(f =>
    '<div class="fact"><b>'+esc(f.label)+'</b><i>'+esc(f.value)+'</i></div>').join('');

  /* highlights */
  const EMB   = 'https://www.youtube-nocookie.com/embed/';
  const ALLOW = 'accelerometer; clipboard-write; encrypted-media; picture-in-picture';
  const frame = (src, title) =>
    '<div class="frame"><iframe src="'+src+'" title="'+esc(title)+
    '" allowfullscreen allow="'+ALLOW+'"></iframe></div>';
  const cap = v => '<p class="vcap">'+esc(v.title)+'</p><p class="vsub">'+esc(v.caption||'')+'</p>';

  const PL    = P.channelPlaylist || '';
  const plSrc = PL ? EMB+'videoseries?list='+encodeURIComponent(PL) : '';
  const vids  = (P.videos||[]).filter(v => v.videoId);
  let h = '';

  if(vids.length){
    h += frame(EMB+encodeURIComponent(vids[0].videoId), vids[0].title) + cap(vids[0]);
    const rest = vids.slice(1);
    if(rest.length){
      h += '<div class="vgrid" style="margin-top:34px">'+rest.map(v =>
        '<div class="vcard">'+frame(EMB+encodeURIComponent(v.videoId), v.title)+cap(v)+'</div>'
      ).join('')+'</div>';
    }
    if(plSrc){
      h += '<div style="margin-top:44px"><p class="subh">Full film library</p>'+
        frame(plSrc, 'Full film library')+
        '<p class="vsub">Every reel on the channel, newest first.</p></div>';
    }
  } else if(plSrc){
    h += frame(plSrc, 'Highlight film')+
      '<p class="vcap">Highlight film</p>'+
      '<p class="vsub">Every reel on the channel, newest first \u2014 open the playlist menu in the player to browse.</p>';
  }

  if(P.channelUrl) h += '<p style="margin-top:30px"><a class="btn btn--dark" href="'+esc(P.channelUrl)+
    '" target="_blank" rel="noopener">All film on YouTube</a></p>';
  $('hl').innerHTML = h;

  /* personal */
  if(P.personalPhoto) $('pimg').style.backgroundImage='url("'+P.personalPhoto+'")';
  const dl = rows => rows.filter(r=>r[1]).map(r=>'<div><dt>'+esc(r[0])+'</dt><dd>'+r[1]+'</dd></div>').join('');
  $('personal').innerHTML = dl((P.personal||[]).map(x=>[x.label, esc(x.value)]));

  /* soccer */
  $('soccer').innerHTML = (P.soccer||[]).map(g =>
    '<div class="grp"><p class="grp__h">'+esc(g.group)+'</p><ul class="ylist">'+
    g.items.map(i=>'<li>'+(i.year?'<b>'+esc(i.year)+':</b> ':'')+esc(i.text)+'</li>').join('')+
    '</ul></div>').join('');

  /* events */
  const ev = P.events||{};
  const evr = l => (l&&l.length)
    ? '<ul class="rows">'+l.map(e=>'<li class="row"><span class="row__m">'+esc(e.name)+
      (e.detail?' <span class="soft">'+esc(e.detail)+'</span>':'')+'</span><span class="row__d">'+
      esc(e.date)+'</span></li>').join('')+'</ul>'
    : '';
  const evrSched = l => (l&&l.length)
    ? '<ul class="rows">'+l.map(e=>'<li class="row row--sched'+(e.national?' row--national':'')+
      '"><span class="row__d">'+esc(e.date)+(e.time?'<span class="row__t">'+esc(e.time)+'</span>':'')+
      '</span><span class="row__m">'+esc(e.name)+
      (e.detail?' <span class="soft">'+esc(e.detail)+'</span>':'')+'</span></li>').join('')+'</ul>'
    : '';
  $('upcomingEvents').innerHTML = evrSched(ev.upcoming) ||
    '<p class="empty">Next season\u2019s schedule posting soon.</p>';

  const prev = ev.previous||{};
  const evGroup = (label, l) => l && l.length ? '<div class="grp"><p class="grp__h">'+label+'</p>'+evr(l)+'</div>' : '';
  $('events').innerHTML = evGroup('International', prev.international)+
                          evGroup('National showcases', prev.nationalShowcases)+
                          evGroup('Other showcases', prev.otherShowcases);

  /* academics */
  const a = P.academics||{};
  $('academics').innerHTML =
    '<div class="grp"><ul class="ylist">'+
    [a.school,a.address,a.classYear,a.gpa?'GPA: '+a.gpa:''].filter(Boolean)
      .map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'+
    ((a.courses||[]).length ? '<div class="grp"><p class="grp__h">Advanced coursework</p><ul class="ylist">'+
      a.courses.map(x=>'<li>'+esc(x).replace(/^(Honors|College Prep|Advanced Projects)\b/, '<b>$1</b>')+'</li>').join('')+'</ul></div>' : '')+
    ((a.transcripts||[]).length ? '<div class="grp"><p class="grp__h">Transcripts</p><ul class="ylist">'+
      a.transcripts.map(t=>'<li><a href="'+esc(t.url)+'" target="_blank" rel="noopener">'+
      esc(t.label)+'</a></li>').join('')+'</ul></div>' : '');

  /* articles */
  $('articles').innerHTML = (P.articles||[]).map(x =>
    '<li class="row"><span class="row__m"><a href="'+esc(x.url)+'" target="_blank" rel="noopener" '+
    'style="color:inherit;text-decoration:none;border-bottom:1px solid var(--sky-dim)">'+esc(x.title)+
    '</a> <span class="soft">'+esc(x.source)+'</span></span><span class="row__d">'+esc(x.year)+'</span></li>').join('');

  /* clubs */
  $('clubs').innerHTML = (P.clubs||[]).map(x =>
    '<li>'+(x.year?'<b>'+esc(x.year)+':</b> ':'')+esc(x.text)+'</li>').join('');

  /* contact */
  $('contactList').innerHTML = dl([
    ['Email', c.email?'<a href="mailto:'+esc(c.email)+'?subject='+
      encodeURIComponent('College coach inquiry \u2014 '+full)+'">'+esc(c.email)+'</a>':''],
    ['Phone', c.phone?'<a href="'+esc(tel(c.phone))+'">'+esc(c.phone)+'</a>':''],
    [c.parentName?c.parentName+' (parent)':'', c.parentEmail?
      '<a href="mailto:'+esc(c.parentEmail)+'">'+esc(c.parentEmail)+'</a>':''],
  ]);
  $('contactList').querySelectorAll('dt').forEach(d=>d.style.color='var(--muted-d)');
  $('contactList').querySelectorAll('dd a').forEach(d=>d.style.color='var(--bone)');
  $('contactList').querySelectorAll('div').forEach(d=>d.style.borderBottomColor='rgba(125,200,236,.22)');

  $('coaches').innerHTML = (P.coaches||[]).map(x =>
    '<div class="coach"><b>'+esc(x.role)+'</b><strong>'+esc(x.name)+'</strong>'+
    (x.email?'<a href="mailto:'+esc(x.email)+'">'+esc(x.email)+'</a>':'')+
    (x.phone?'<a href="'+esc(tel(x.phone))+'">'+esc(x.phone)+'</a>':'')+'</div>').join('');

  $('fname').textContent = full+(P.number?' \u00B7 #'+P.number:'');
  $('fupd').textContent  = P.lastUpdated?'Updated '+P.lastUpdated:'';
})();
</script>
</body>
</html>
